name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Set up Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Set up Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install npm dependencies
      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      # 6. Build the web app with Vite
      - name: Build web app
        working-directory: mobile-app
        run: npm run build

      # 7. Add the Android platform via Capacitor
      - name: Add Android platform
        working-directory: mobile-app
        run: npx cap add android

      # 8. Sync web assets into the Android project
      - name: Sync Capacitor
        working-directory: mobile-app
        run: npx cap sync android

      # 9. Build the debug APK
      - name: Build APK
        working-directory: mobile-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      # 10. Upload the APK as a downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectDashboard-APK
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
